<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f4">
  <title>Коллекция «Дофаминовый зум» — Ателье Софи</title>
  <meta name="description" content="Коллекция комбинезонов для собак «Дофаминовый зум»: модели, артикулы, материалы, фотографии и цены.">
  <meta property="og:title" content="Коллекция «Дофаминовый зум» — Ателье Софи">
  <meta property="og:description" content="Все модели коллекции на одной странице: Микки-комфортик, Дьяволёнок, Микки-дрип и яркая мембранная линейка.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://sofibrend3-cmd.github.io/atelier-sofi-reglament/dofaminovy-zoom/assets/cover.jpg">
  <style>
    :root{--paper:#fff8f4;--white:#fff;--ink:#301f19;--muted:#79675f;--line:#eadbd4;--wine:#962817;--red:#ef382d;--green:#4bc878;--blue:#2399d8;--yellow:#ffd847;--pink:#ed3b83;--soft:#f7eee9}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.55}
    img{display:block;max-width:100%}
    button{font:inherit}
    a{color:inherit}
    .shell{width:min(1220px,calc(100% - 40px));margin:0 auto}
    .topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:rgba(255,248,244,.94);backdrop-filter:blur(14px)}
    .topbar-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-family:Georgia,serif;font-size:22px;text-decoration:none}
    .back{color:var(--wine);font-size:13px;font-weight:900;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
    .cover{padding:26px 0 18px}
    .cover-grid{display:grid;grid-template-columns:minmax(340px,.73fr) 1.27fr;min-height:760px;overflow:hidden;border:1px solid var(--line);background:#fff}
    .cover-image{min-height:650px;background:#f8eeee}
    .cover-image img{width:100%;height:100%;object-fit:cover}
    .cover-copy{position:relative;display:flex;flex-direction:column;justify-content:center;padding:clamp(48px,8vw,110px);overflow:hidden}
    .cover-copy::before,.cover-copy::after{content:"";position:absolute;border-radius:50%;filter:blur(1px);opacity:.14}
    .cover-copy::before{width:360px;height:360px;right:-160px;top:-150px;background:var(--green)}
    .cover-copy::after{width:260px;height:260px;left:-120px;bottom:-120px;background:var(--pink)}
    .eyebrow{position:relative;margin:0 0 22px;color:var(--wine);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    h1,h2,h3,p{margin-top:0}
    h1{position:relative;margin-bottom:28px;font-family:Georgia,serif;font-size:clamp(58px,7.5vw,108px);font-weight:400;line-height:.86;letter-spacing:-.06em}
    .lead{position:relative;max-width:650px;margin-bottom:28px;color:var(--muted);font-size:21px}
    .opening{padding:18px 0 52px}
    .opening-box{display:grid;grid-template-columns:repeat(3,1fr);min-height:280px;overflow:hidden;border:1px solid var(--line);background:#fff}
    .opening-box img{width:100%;height:100%;object-fit:cover}
    .catalog{padding:18px 0 92px}
    .group{scroll-margin-top:90px}
    .group+.group{margin-top:76px}
    .group-head{display:grid;grid-template-columns:210px 1fr;gap:30px;align-items:end;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
    .group-kicker{color:var(--wine);font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
    .group-head h2{margin:0;font-family:Georgia,serif;font-size:clamp(36px,5vw,58px);font-weight:400;line-height:1}
    .products{display:grid;gap:18px}
    .product{display:grid;grid-template-columns:minmax(360px,.92fr) 1.08fr;min-height:590px;scroll-margin-top:84px;overflow:hidden;border:1px solid var(--line);background:#fff}
    .product:nth-child(even) .gallery{order:2}
    .gallery{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;background:#f5f1ee}
    .main-image{position:relative;width:100%;min-height:480px;padding:0;border:0;background:#f5f1ee;cursor:zoom-in;overflow:hidden}
    .main-image img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
    .main-image:hover img{transform:scale(1.015)}
    .zoom-label{position:absolute;right:16px;bottom:16px;padding:8px 11px;border:1px solid rgba(255,255,255,.75);background:rgba(35,25,20,.62);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .thumbs{display:flex;gap:1px;overflow-x:auto;background:var(--line);scrollbar-width:thin}
    .thumb{flex:0 0 122px;aspect-ratio:4/3;padding:0;border:0;background:#fff;cursor:pointer;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;opacity:.72}
    .thumb[aria-pressed="true"] img{opacity:1;box-shadow:inset 0 0 0 4px var(--wine)}
    .product-copy{display:flex;flex-direction:column;padding:clamp(34px,5vw,66px)}
    .article{margin:0 0 16px;color:var(--wine);font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
    .article.missing{color:var(--muted)}
    .product h3{margin-bottom:18px;font-family:Georgia,serif;font-size:clamp(38px,4.4vw,60px);font-weight:400;line-height:.95;letter-spacing:-.04em}
    .description{max-width:640px;margin-bottom:24px;color:var(--muted);font-size:17px}
    .details{display:grid;gap:0;margin:0 0 26px}
    .detail{display:grid;grid-template-columns:135px 1fr;gap:18px;padding:13px 0;border-top:1px solid var(--line)}
    .detail:last-child{border-bottom:1px solid var(--line)}
    .detail dt{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .detail dd{margin:0;color:var(--muted)}
    .product-actions{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:auto}
    .price{font-family:Georgia,serif;font-size:36px;color:var(--wine)}
    .price small{display:block;margin-bottom:3px;color:var(--muted);font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .share-button{flex:0 0 auto;padding:12px 16px;border:1px solid var(--wine);border-radius:999px;background:#fff;color:var(--wine);font-size:12px;font-weight:900;letter-spacing:.06em;cursor:pointer;text-transform:uppercase}
    .share-button:hover{background:var(--wine);color:#fff}
    footer{padding:28px 0 42px;color:var(--muted);font-size:14px}
    .footer-inner{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:24px}
    .lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(20,13,10,.95)}
    .lightbox.open{display:flex}
    .lightbox img{max-width:96vw;max-height:89vh;object-fit:contain}
    .lightbox-close{position:absolute;right:22px;top:18px;width:46px;height:46px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(0,0,0,.25);color:#fff;font-size:28px;cursor:pointer}
    .lightbox-caption{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:90vw;padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.58);color:#fff;font-size:13px;text-align:center}
    @media(max-width:940px){.cover-grid{grid-template-columns:1fr;min-height:0}.cover-image{min-height:760px}.cover-copy{padding:64px 42px}.product{grid-template-columns:1fr}.product:nth-child(even) .gallery{order:0}.main-image{min-height:620px}.group-head{grid-template-columns:1fr;gap:7px}.opening-box{min-height:220px}}
    @media(max-width:620px){.shell{width:min(100% - 24px,1220px)}.topbar-inner{min-height:60px}.brand{font-size:19px}.back{font-size:11px}.cover{padding-top:12px}.cover-image{min-height:600px}.cover-copy{padding:46px 24px}.lead{font-size:18px}.opening{padding-bottom:34px}.opening-box{grid-template-columns:1fr}.opening-box img{aspect-ratio:4/3}.catalog{padding-top:10px}.group+.group{margin-top:58px}.product{min-height:0}.main-image{min-height:390px}.thumb{flex-basis:94px}.product-copy{padding:30px 22px}.product h3{font-size:40px}.detail{grid-template-columns:1fr;gap:4px}.product-actions{align-items:flex-start;flex-direction:column}.price{margin-top:18px}.footer-inner{flex-direction:column}.zoom-label{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.main-image img{transition:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell topbar-inner"><a class="brand" href="../vitrina/">Ателье Софи · Витрина</a><a class="back" href="../vitrina/">← Все разделы</a></div></header>

  <main>
    <section class="cover">
      <div class="shell cover-grid">
        <div class="cover-image"><img src="assets/cover.jpg" alt="Обложка коллекции Дофаминовый зум"></div>
        <div class="cover-copy">
          <p class="eyebrow">Коллекция Ателье Софи</p>
          <h1>Дофаминовый зум</h1>
          <p class="lead">Яркие зимние комбинезоны: мягкие шубки, сияющие ткани и сочные сочетания мембраны. Все модели коллекции собраны на одной странице.</p>
        </div>
      </div>
    </section>

    <section class="opening"><div class="shell opening-box"><img src="assets/hero-comfort.jpg" alt="Модели Микки-комфортик"><img src="assets/hero-drip.jpg" alt="Модели Микки-дрип"><img src="assets/hero-membrane.jpg" alt="Мембранные модели коллекции"></div></section>

    <section class="catalog"><div class="shell" id="catalog"></div></section>
  </main>

  <footer><div class="shell footer-inner"><span>Ателье Софи · «Дофаминовый зум»</span><a href="../vitrina/">Вернуться ко всей витрине</a></div></footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр фотографии"><button class="lightbox-close" type="button" aria-label="Закрыть">×</button><img id="lightbox-image" alt=""><div class="lightbox-caption" id="lightbox-caption"></div></div>

  <script>
    const groups=[
      {kicker:'Мягкая линия',title:'Микки-комфортик',products:[
        {name:'Микки-комфортик — Синий',article:'161',price:'14 500 ₽',description:'Комбинезон с мягкой синей шубкой и ушками Микки. Яркий образ для зимних прогулок.',materials:'Ткань «Сияние», мех синий №1302',lining:'Атлас тёмно-синий №9524',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['comfort-blue-2.jpg','comfort-blue-1.jpg','comfort-blue-3.jpg']},
        {name:'Микки-комфортик — Красный',article:'162',price:'14 500 ₽',description:'Красный комбинезон с мягкой шубкой и узнаваемыми ушками Микки. Тёплая выразительная модель для холодного сезона.',materials:'Ткань «Сияние», мех красный №1301',lining:'Атлас красный №9702',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['comfort-red-1.jpg','comfort-red-2.jpg','comfort-red-3.jpg']},
        {name:'Микки-комфортик — Зелёный',article:'163',price:'14 500 ₽',description:'Сочная зелёная шубка сочетается с тёмно-изумрудными деталями и ушками Микки.',materials:'Ткань «Сияние», мех зелёный №1303',lining:'Атлас бутылочный №9420',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['comfort-green-1.jpg','comfort-green-2.jpg','comfort-green-3.jpg']},
        {name:'Дьяволёнок-комфортик',article:'',price:'14 500 ₽',description:'Красная утеплённая модель с мягкой шубкой и чёрными рожками.',materials:'Ткань «Сияние» алый №501, мех красный №1301',lining:'Атлас красный №9702',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['devil-comfort-1.jpg','devil-comfort-2.jpg']},
        {name:'Дьяволёнок',article:'',price:'11 300 ₽',description:'Сияющая красно-серебристая модель с контрастными чёрными рожками.',materials:'«Милан» серебро №401, «Сияние» алый №501',lining:'Атлас красный №9702',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['devil-drip-1.jpg']}
      ]},
      {kicker:'Сияющая линия',title:'Микки-дрип',products:[
        {name:'Микки-дрип — Фуксия',article:'157',price:'11 300 ₽',description:'Фуксия и серебро в выразительной модели с ушками Микки.',materials:'«Милан» серебро №401, «Сияние» малина №504',lining:'Атлас ярко-розовый №9820',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['drip-fuchsia-1.jpg','drip-fuchsia-2.jpg','drip-fuchsia-3.jpg','drip-fuchsia-4.jpg','drip-fuchsia-5.jpg','drip-fuchsia-6.jpg','drip-fuchsia-7.jpg','drip-fuchsia-8.jpg','drip-fuchsia-9.jpg','drip-fuchsia-10.jpg','drip-fuchsia-11.jpg','drip-fuchsia-12.jpg']},
        {name:'Микки-дрип — Сапфировый',article:'158',price:'11 300 ₽',description:'Глубокий сапфировый оттенок и серебристый «Милан» создают холодное сияющее сочетание.',materials:'«Милан» серебро №401, «Сияние» тёмный сапфир №502',lining:'Атлас тёмно-синий №9524',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['drip-sapphire-1.jpg','drip-sapphire-2.jpg','drip-sapphire-3.jpg','drip-sapphire-4.jpg','drip-sapphire-5.jpg','drip-sapphire-6.jpg','drip-sapphire-7.jpg','drip-sapphire-8.jpg','drip-sapphire-9.jpg','drip-sapphire-10.jpg']},
        {name:'Микки-дрип — Алый',article:'159',price:'11 300 ₽',description:'Алый цвет, серебристые вставки и ушки Микки — яркая модель для зимы.',materials:'«Милан» серебро №401, «Сияние» алый №501',lining:'Атлас красный №9702',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['drip-scarlet-1.jpg','drip-scarlet-2.jpg','drip-scarlet-3.jpg','drip-scarlet-4.jpg','drip-scarlet-5.jpg','drip-scarlet-7.jpg','drip-scarlet-9.jpg','drip-scarlet-10.jpg','drip-scarlet-11.jpg','drip-scarlet-12.jpg','drip-scarlet-13.jpg']},
        {name:'Микки-дрип — Изумрудный',article:'160',price:'11 300 ₽',description:'Тёмный изумруд соединён с серебром и дополнен ушками Микки.',materials:'«Милан» серебро №401, «Сияние» тёмный изумруд №503',lining:'Атлас бутылочный №9420',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['drip-emerald-1.jpg','drip-emerald-2.jpg','drip-emerald-3.jpg','drip-emerald-4.jpg','drip-emerald-5.jpg','drip-emerald-6.jpg','drip-emerald-7.jpg','drip-emerald-8.jpg']}
      ]},
      {kicker:'Яркая мембрана',title:'Цвет включён',products:[
        {name:'Оранжевая имба',article:'164',price:'11 200 ₽',description:'Контрастный оранжево-голубой комбинезон из мембраны для заметных прогулок.',materials:'Мембрана оранжевая №1204 и лазурная №1209',lining:'Атлас жёлтый №9911A',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['membrane-orange-1.jpg','membrane-orange-2.jpg','membrane-orange-3.jpg']},
        {name:'Мятный слэй',article:'165',price:'11 200 ₽',description:'Светло-зелёная мембрана с малиновыми акцентами и яркой окантовкой.',materials:'Мембрана светло-зелёная №1205 и малиновая №1214',lining:'Атлас розовый №9814',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['membrane-mint-1.jpg','membrane-mint-2.jpg','membrane-mint-3.jpg']},
        {name:'Лимонный краш',article:'166',price:'11 200 ₽',description:'Лимонно-салатовый комбинезон из мембраны с розовой окантовкой.',materials:'Мембрана жёлтая №1203 и лайм №1206',lining:'Атлас малиновый №918',insulation:'Тинсулейт 150 на туловище, 50 на лапах и капюшоне',photos:['membrane-lemon-1.jpg','membrane-lemon-2.jpg','membrane-lemon-3.jpg']}
      ]}
    ];

    const catalog=document.getElementById('catalog');
    const asset=photo=>`assets/${photo}`;
    const esc=value=>value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));

    groups.forEach((group,groupIndex)=>{
      const section=document.createElement('section');
      section.className='group';
      section.id=`group-${groupIndex+1}`;
      section.innerHTML=`<div class="group-head"><span class="group-kicker">${esc(group.kicker)}</span><h2>${esc(group.title)}</h2></div><div class="products"></div>`;
      const list=section.querySelector('.products');
      group.products.forEach((product,productIndex)=>{
        const card=document.createElement('article');
        card.className='product';
        card.id=product.article?`model-${product.article}`:`model-${groupIndex+1}-${productIndex+1}`;
        const thumbs=product.photos.map((photo,index)=>`<button class="thumb" type="button" data-photo="${asset(photo)}" aria-label="Показать фото ${index+1}: ${esc(product.name)}" aria-pressed="${index===0}"><img src="${asset(photo)}" loading="lazy" alt="${esc(product.name)}, фото ${index+1}"></button>`).join('');
        const article=product.article?`Артикул ${esc(product.article)}`:'Артикул не указан';
        card.innerHTML=`
          <div class="gallery">
            <button class="main-image" type="button" data-caption="${esc(product.name)}"><img src="${asset(product.photos[0])}" loading="lazy" alt="${esc(product.name)}"><span class="zoom-label">Увеличить фото</span></button>
            <div class="thumbs">${thumbs}</div>
          </div>
          <div class="product-copy">
            <p class="article${product.article?'':' missing'}">${article}</p>
            <h3>${esc(product.name)}</h3>
            <p class="description">${esc(product.description)}</p>
            <dl class="details">
              <div class="detail"><dt>Сезон</dt><dd>Зима</dd></div>
              <div class="detail"><dt>Материалы</dt><dd>Курточные непромокаемые ткани</dd></div>
              <div class="detail"><dt>Подклад</dt><dd>${esc(product.lining)}. При необходимости подберём вариант под вашу собачку и климат вашего региона.</dd></div>
              <div class="detail"><dt>Утепление</dt><dd>Подберем утепление, которое нужно именно вашей собачке в вашем регионе.</dd></div>
            </dl>
            <div class="product-actions">
              <div class="price"><small>Цена модели</small>${esc(product.price)}</div>
              <button class="share-button" type="button" data-name="${esc(product.name)}" data-article="${esc(product.article)}">Поделиться</button>
            </div>
          </div>`;
        list.appendChild(card);
      });
      catalog.appendChild(section);
    });

    document.querySelectorAll('.product').forEach(card=>{
      const main=card.querySelector('.main-image img');
      const mainButton=card.querySelector('.main-image');
      card.querySelectorAll('.thumb').forEach(thumb=>thumb.addEventListener('click',()=>{
        main.src=thumb.dataset.photo;
        main.alt=thumb.querySelector('img').alt;
        card.querySelectorAll('.thumb').forEach(item=>item.setAttribute('aria-pressed',String(item===thumb)));
      }));
      mainButton.addEventListener('click',()=>openLightbox(main.src,mainButton.dataset.caption));
    });

    document.querySelectorAll('.share-button').forEach(button=>button.addEventListener('click',async()=>{
      const card=button.closest('.product');
      const url=`${location.origin}${location.pathname}#${card.id}`;
      const article=button.dataset.article?` (артикул ${button.dataset.article})`:'';
      const text=`Мне понравилась модель «${button.dataset.name}»${article} из коллекции «Дофаминовый зум».`;
      try{
        if(navigator.share){await navigator.share({title:button.dataset.name,text,url});return}
        await navigator.clipboard.writeText(`${text}\n${url}`);
        const original=button.textContent;
        button.textContent='Ссылка скопирована';
        setTimeout(()=>{button.textContent=original},2200);
      }catch(error){
        if(error.name!=='AbortError'){
          const area=document.createElement('textarea');
          area.value=`${text}\n${url}`;
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
          button.textContent='Ссылка скопирована';
          setTimeout(()=>{button.textContent='Поделиться'},2200);
        }
      }
    }));

    const lightbox=document.getElementById('lightbox');
    const lightboxImage=document.getElementById('lightbox-image');
    const lightboxCaption=document.getElementById('lightbox-caption');
    const closeButton=lightbox.querySelector('.lightbox-close');
    function openLightbox(src,caption){lightboxImage.src=src;lightboxImage.alt=caption;lightboxCaption.textContent=caption;lightbox.classList.add('open');closeButton.focus()}
    function closeLightbox(){lightbox.classList.remove('open');lightboxImage.src=''}
    closeButton.addEventListener('click',closeLightbox);
    lightbox.addEventListener('click',event=>{if(event.target===lightbox)closeLightbox()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLightbox()});
  </script>
</body>
</html>

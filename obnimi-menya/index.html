        const card=document.createElement('article');card.className='product';card.id=`model-${product.article}`;
        const thumbs=product.photos.map((photo,index)=>`<button class="thumb" type="button" data-photo="${asset(photo)}" aria-label="Показать фото ${index+1}: ${esc(product.name)}" aria-pressed="${index===0}"><img src="${asset(photo)}" loading="lazy" alt="${esc(product.name)}, фото ${index+1}"></button>`).join('');
        card.innerHTML=`<div class="gallery"><button class="main-image" type="button" data-caption="${esc(product.name)}"><img src="${asset(product.photos[0])}" loading="lazy" alt="${esc(product.name)}"><span class="zoom-label">Увеличить фото</span></button><div class="thumbs">${thumbs}</div></div><div class="product-copy"><p class="article">Артикул ${esc(product.article)}</p><h3>${esc(product.name)}</h3><p class="description">${esc(product.description)}</p><dl class="details"><div class="detail"><dt>Сезон</dt><dd>${esc(product.season)}</dd></div><div class="detail"><dt>Материалы</dt><dd>${esc(product.materials)}</dd></div><div class="detail"><dt>Подклад</dt><dd>${esc(product.lining)}</dd></div><div class="detail"><dt>Утепление</dt><dd>${esc(product.insulation)}</dd></div></dl><div class="product-actions"><div class="price"><small>Цена модели</small>${esc(product.price)}</div><button class="share-button" type="button" data-name="${esc(product.name)}" data-article="${esc(product.article)}">Поделиться</button></div></div>`;
        list.appendChild(card);
      });catalog.appendChild(section);
    });
    document.querySelectorAll('.product').forEach(card=>{const main=card.querySelector('.main-image img');const mainButton=card.querySelector('.main-image');card.querySelectorAll('.thumb').forEach(thumb=>thumb.addEventListener('click',()=>{main.src=thumb.dataset.photo;main.alt=thumb.querySelector('img').alt;card.querySelectorAll('.thumb').forEach(item=>item.setAttribute('aria-pressed',String(item===thumb)))}));mainButton.addEventListener('click',()=>openLightbox(main.src,mainButton.dataset.caption))});
    document.querySelectorAll('.share-button').forEach(button=>button.addEventListener('click',async()=>{const card=button.closest('.product');const url=`${location.origin}${location.pathname}#${card.id}`;const text=`Мне понравилась модель «${button.dataset.name}» (артикул ${button.dataset.article}) из коллекции «Обними меня».`;try{if(navigator.share){await navigator.share({title:button.dataset.name,text,url});return}await navigator.clipboard.writeText(`${text}\n${url}`);const original=button.textContent;button.textContent='Ссылка скопирована';setTimeout(()=>{button.textContent=original},2200)}catch(error){if(error.name!=='AbortError'){const area=document.createElement('textarea');area.value=`${text}\n${url}`;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();button.textContent='Ссылка скопирована';setTimeout(()=>{button.textContent='Поделиться'},2200)}}}));
    const lightbox=document.getElementById('lightbox');const lightboxImage=document.getElementById('lightbox-image');const lightboxCaption=document.getElementById('lightbox-caption');const closeButton=lightbox.querySelector('.lightbox-close');function openLightbox(src,caption){lightboxImage.src=src;lightboxImage.alt=caption;lightboxCaption.textContent=caption;lightbox.classList.add('open');closeButton.focus()}function closeLightbox(){lightbox.classList.remove('open');lightboxImage.src=''}closeButton.addEventListener('click',closeLightbox);lightbox.addEventListener('click',event=>{if(event.target===lightbox)closeLightbox()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLightbox()});
  </script>
</body>
</html>
